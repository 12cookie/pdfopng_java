# suppress inspection "UnusedProperty" for whole file
spring.application.name=demo

# PDF -> PNG rendering (Rust pdfium-render via FFM). All optional.
# pdf.render.library-path=/path/to/libpdf_render.dylib
# pdf.render.pdfium-path=native/pdf-render/lib/darwin-aarch64/libpdfium.dylib
# Renderer pool size = number of native library copies used. 0 = all slots bundled by the
# build (pom property pdf.render.slots, default 6). Cannot exceed the bundled count.
pdf.render.concurrency=0
pdf.render.acquire-timeout=30s
pdf.render.default-dpi=150
pdf.render.max-dpi=600
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
